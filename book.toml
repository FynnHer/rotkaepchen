# ---------------------------------------------------------------------------
# Zentrale Konfiguration des Buchbauers.
# Saemtliche Layout-, Typografie- und Farbparameter stehen ausschliesslich
# hier. Kapitel-Dateien enthalten nur Inhalt.
# ---------------------------------------------------------------------------

[book]
title         = "Rotkäppchen"
subtitle      = "Ein Märchen der Brüder Grimm"
author        = "Neu gesetzt vom Buchbauer"
chapters_dir  = "chapters"        # Ordner mit den Kapitel-Markdown-Dateien
# Mehrere Asset-Ordner sind erlaubt: der erste gewinnt. So ersetzen die
# echten Illustrationen die Platzhalter Datei fuer Datei.
assets_dir    = ["assets/images", "beispiele/bilder"]
output        = "build/rotkaeppchen.pdf"
cover_image   = "rotkaepchen_cover"  # Asset-Schluessel fuer die Titelseite
cover_palette = "hearth"

[print]
# Druckvorstufe. bleed_mm ist der Anschnitt, um den die PDF-Seite ueber das
# Endformat hinausragt; der Papierton und randabfallende Bilder laufen hinein.
bleed_mm            = 3.0
crop_marks          = true    # Schnittmarken im Anschnitt
crop_mark_length_mm = 4.0
crop_mark_offset_mm = 1.5
crop_mark_width_pt  = 0.25
min_image_dpi       = 300.0   # darunter warnt der Builder beim Bau
color_space         = "cmyk"  # "cmyk" fuer den Druck, "rgb" fuer die Bildschirmfassung
jpeg_quality        = 95      # nur fuer CMYK - PNG kann diesen Farbraum nicht

[cover]
full_page_image   = true   # Titelbild randabfallend ueber die ganze Seite
typeset_band      = false  # Der Umschlag traegt Titel und Verfasser im Bild
tritone           = false  # Umschlag in seinen eigenen Farben, wie die Raetselseiten
band_height_ratio = 0.34   # Anteil der Seitenhoehe fuer das Titelfeld
band_inset_mm     = 0.0

[page]
format           = "A5"   # A4 | A5 | A6 | B5 | LETTER  oder  [breite_mm, hoehe_mm]
margin_top_mm    = 20.0
margin_bottom_mm = 22.0
margin_left_mm   = 19.0
margin_right_mm  = 19.0

[typography]
# Base-14-Namen als Rueckfallebene; font_files gewinnt, falls vorhanden.
serif                   = "Times-Roman"
serif_bold              = "Times-Bold"
serif_italic            = "Times-Italic"
sans                    = "Helvetica"
body_size_pt            = 10.5
leading_factor          = 1.52   # Zeilenabstand als Vielfaches der Schriftgroesse
chapter_title_size_pt   = 25.0
chapter_number_size_pt  = 8.5
quote_size_pt           = 10.5
caption_size_pt         = 8.0
running_head_size_pt    = 7.5
folio_size_pt           = 8.5
space_after_paragraph_pt = 0.0
first_line_indent_mm    = 4.5
opening_initial         = true   # erste Zeile eines Kapitels mit Versalie
initial_scale           = 2.0    # Groesse der Versalie als Vielfaches der Grundschrift
cover_title_size_pt     = 44.0
cover_subtitle_size_pt  = 11.5

# Optionale TTF-Dateien. Fehlt eine Datei, wird still auf Base-14 zurueckgefallen.
[typography.font_files]
regular    = "/System/Library/Fonts/Supplemental/Georgia.ttf"
bold       = "/System/Library/Fonts/Supplemental/Georgia Bold.ttf"
italic     = "/System/Library/Fonts/Supplemental/Georgia Italic.ttf"
bolditalic = "/System/Library/Fonts/Supplemental/Georgia Bold Italic.ttf"

[images]
# Werte > 1.0 lassen das Bild in die Raender laufen - Illustrationen sollen
# praesent sein, nicht in der Textspalte verschwinden.
width_ratio             = 1.08   # Anteil der Satzspiegelbreite
max_height_ratio        = 0.52   # Anteil der Satzspiegelhoehe
opener_width_ratio      = 1.16   # Kapitelbild auf dem Aufschlag
opener_max_height_ratio = 0.46
tritone                 = false  # Illustrationen bleiben, wie sie sind - eigene Bildwelt, wie Umschlag und Raetselseiten
dither                  = true   # nur wirksam, wenn tritone wieder eingeschaltet wird
space_before_mm         = 6.0
space_after_mm          = 4.0
captions                = true
auto_min_score          = 1    # Stichwort-Treffer, ab denen automatisch illustriert wird
max_auto_illustrations  = 0    # jedes Kapitel bringt sein eigenes Bild mit - keine Automatik
title_weight            = 5    # Gewicht eines Stichwort-Treffers im Kapiteltitel

[colors]
max_per_page    = 3        # Farben je Seite, wird nach dem Bau geprueft
# Drei Papiertoene plus Schrift- und Akzentfarbe: fuenf Farben im Buch,
# aber nie mehr als drei auf einer Seite - der Druck bleibt seitenweise
# dreifarbig. Ein vierter Papierton ist damit ausgeschlossen.
max_total       = 5
paper_counts    = true     # der Papierton zaehlt als eine der drei Farben
default_palette = "hearth"
rotate          = []       # Reihum-Verteilung; hier waehlt jedes Kapitel selbst

# Drei Paletten, die sich Schrift und Akzent teilen und sich nur im
# Papierton unterscheiden. Welches Kapitel welche bekommt, steht in seinem
# Frontmatter ("palette:") und folgt dem Ort der Handlung:
#
#   hearth   Dorf und Zuhause          Kapitel 1-3 und 15, Autorenseite, Inhalt
#   wald     der Weg durch den Wald    Kapitel 4-7
#   daemmer  das Haus der Grossmutter  Kapitel 8-14
#
# Jede Palette besteht aus genau drei Rollen und gilt fuer Satz und
# Seitengrund. Die Illustrationen sind davon ausgenommen
# (images.tritone = false) und bringen ihre eigenen Farben mit - wie der
# Umschlag und die Raetselseiten.
[colors.palettes.hearth]
paper  = "#F4ECDC"   # warmer Pergamentton - Dorf, Zuhause, gutes Ende
ink    = "#2A3B2E"   # Waldgruen, dunkel
accent = "#A81E2D"   # Rotkaeppchen-Rot

[colors.palettes.wald]
paper  = "#E4EFD3"   # helles Blattgruen - der Wald bei Tag
ink    = "#2A3B2E"
accent = "#A81E2D"

[colors.palettes.daemmer]
paper  = "#D9E1EA"   # kuehles Daemmerblau - drinnen, beim Wolf
ink    = "#2A3B2E"
accent = "#A81E2D"

# ---------------------------------------------------------------------------
# Die Seite ueber die Verfasser. Ihr Text steht in einer eigenen Datei - wie
# ein Kapitel, nur ohne Nummer. "after" ist die Nummer des Kapitels, hinter
# dem sie erscheint; 0 stellt sie vor das erste Kapitel.
# ---------------------------------------------------------------------------
[about]
enabled = true
palette = "hearth"   # wie das Dorf - die Seite steht vor dem ersten Kapitel
file    = "seiten/ueber-die-gebrueder-grimm.md"
after   = 0
image_height_ratio = 0.26   # so stehen Bild und Text auf einer Seite
# Die beiden Werbe-Umschlaege im Fliesstext der Seite: kleiner als eine
# Kapitel-Illustration, damit beide zusammen auf eine Seite passen.
body_image_height_ratio = 0.30

# ---------------------------------------------------------------------------
# Mitmach-Seiten. Die Raetselseiten liegen in einem eigenen Ordner, sie
# gehoeren nicht zu den Illustrationen und werden keinem Kapitel automatisch
# zugeordnet. Jede Seite steht randabfallend fuer sich, ihr Platz im Buch
# haengt an "after": der Nummer des Kapitels, hinter dem sie erscheint.
# ---------------------------------------------------------------------------
[activities]
enabled = true
dir     = "assets/raetsel"
tritone = false   # Raetselseiten sind von der Drei-Farben-Regel ausgenommen
in_toc  = true    # mit eigener Zeile im Inhaltsverzeichnis

[[activities.pages]]
image = "labyrinth_raetsel"
after = 4          # nach "Der helle Wald" - der Weg zur Grossmutter liegt vor ihr
title = "Rätselseite: Rotkäppchens Weg"

[[activities.pages]]
image = "wimmelbild_raetsel"
after = 9          # nach "Der Streich" - kurz bevor sie am Haus ankommt
title = "Rätselseite: Wimmelbild"

[[activities.pages]]
image = "zaehl_raetsel"
after = 15         # nach dem letzten Kapitel - zum Nachzaehlen am Schluss
title = "Rätselseite: Zähl mit!"

[toc]
enabled = true
title   = "Inhalt"

# Stichworte fuer die automatische Kapitel-Zuordnung der Bilder.
# Schluessel = Dateiname im Asset-Ordner (ohne Endung).
[assets.aliases]
rotkaeppchen = ["Rotkäppchen", "Mädchen", "Käppchen", "Kind"]
wolf         = ["Wolf", "Wölfe", "Untier", "Bestie"]
grossmutter  = ["Großmutter", "Großmütterchen", "Oma", "Ahnin"]
jaeger       = ["Jäger", "Förster", "Büchse", "Schere"]
wald         = ["Wald", "Bäume", "Tannen", "Dickicht", "Gehölz"]
titelbild    = []   # nur fuer den Umschlag, nie automatisch zugeordnet
rotkaepchen-cover = []       # Umschlagbild
gebruedergrim-infobild = []  # nur auf der Seite ueber die Verfasser

# Die 15 Kapitelbilder und die beiden Werbeseiten stehen fest im
# Frontmatter ihrer Seite ("hero:" bzw. "![...](werbung_...)"). Leere
# Aliaslisten halten sie aus der Stichwort-Automatik heraus - sonst
# koennte ein Kapitel das Bild eines anderen einsammeln.
kapitel-1  = []
kapitel-2  = []
kapitel-3  = []
kapitel-4  = []
kapitel-5  = []
kapitel-6  = []
kapitel-7  = []
kapitel-8  = []
kapitel-9  = []
kapitel-10 = []
kapitel-11 = []
kapitel-12 = []
kapitel-13 = []
kapitel-14 = []
kapitel-15 = []
werbung-wolf           = []  # nur auf der Seite ueber die Verfasser
werbung-schneewittchen = []  # nur auf der Seite ueber die Verfasser

# Bildunterschriften. Ohne Eintrag bleibt eine Illustration unbeschriftet;
# ein ![Text](wolf) im Markdown hat immer Vorrang.
[assets.captions]
rotkaeppchen = "Rotkäppchen macht sich auf den Weg"
wolf         = "Der Wolf im Dickicht"
grossmutter  = "Das Haus der Großmutter"
jaeger       = "Der Jäger kommt vorbei"
wald         = "Der Wald zwischen Dorf und Haus"
