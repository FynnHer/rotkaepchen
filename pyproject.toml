[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buchbauer"
version = "0.1.0"
description = "Baut aus Markdown-Kapiteln ein druckfertiges, dreifarbiges PDF-Buch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pypdfium2>=4.0"]

[project.scripts]
buchbauer = "buchbauer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
